name: Debug Network Reachability

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/debug-network.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: curl gemini api
        run: |
          echo "key length: ${#GEMINI_API_KEY}"
          curl -s -w "\ngemini: HTTP %{http_code}, connect %{time_connect}s, total %{time_total}s\n" --max-time 15 \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite:generateContent?key=${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"contents":[{"parts":[{"text":"say ok"}]}]}' || echo "gemini: curl failed/timed out"
      - name: curl parivahan
        run: |
          curl -s -o /dev/null -w "parivahan: HTTP %{http_code}, connect %{time_connect}s, total %{time_total}s\n" --max-time 15 https://echallan.parivahan.gov.in/index/accused-challan || echo "parivahan: curl failed/timed out"
      - name: curl ts eChallan
        run: |
          curl -s -o /dev/null -w "ts_echallan: HTTP %{http_code}, connect %{time_connect}s, total %{time_total}s\n" --max-time 15 https://echallan.tspolice.gov.in/publicview/ || echo "ts_echallan: curl failed/timed out"
      - name: runner IP / ASN
        run: |
          curl -s --max-time 10 https://ifconfig.me
          echo
